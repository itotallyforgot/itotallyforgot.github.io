<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="sig2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C5571D"/>
      <stop offset="1" stop-color="#F76E25"/>
    </linearGradient>
  </defs>
  <text x="24" y="36" font-size="19" font-weight="650" fill="#E8E0D5">Many-shot jailbreak: instruction vs structure</text>
  <text x="24" y="57" font-size="13" fill="#9A9A9A">Attack success rate. Fine-tuning only delayed it; a classifier ended it.</text>

  <!-- baseline y=280, top y=80 for 0..70% -> 2.857 px/% -->
  <line x1="92" y1="280" x2="520" y2="280" stroke="#3A3A3A" stroke-width="1"/>
  <text x="82" y="284" font-size="11" fill="#6E6E6E" text-anchor="end">0</text>
  <text x="82" y="120" font-size="11" fill="#6E6E6E" text-anchor="end">70%</text>

  <!-- bar 1: instruction = 61% -> height 174 -> y=106, muted grey -->
  <rect x="150" y="106" width="130" height="174" rx="5" fill="#5C5C5C"/>
  <text x="215" y="98" font-size="21" font-weight="700" fill="#B9B2A8" text-anchor="middle">61%</text>
  <text x="215" y="302" font-size="12.5" fill="#C9C2B8" text-anchor="middle">Refusal training</text>
  <text x="215" y="319" font-size="12" fill="#8A8A8A" text-anchor="middle">(instruction)</text>

  <!-- bar 2: structure = 2% -> height ~6 -> y=274, signal orange -->
  <rect x="350" y="271" width="130" height="9" rx="3" fill="url(#sig2)"/>
  <text x="415" y="262" font-size="21" font-weight="700" fill="#F76E25" text-anchor="middle">2%</text>
  <text x="415" y="302" font-size="12.5" fill="#F76E25" font-weight="650" text-anchor="middle">Input classifier</text>
  <text x="415" y="319" font-size="12" fill="#C98A5A" text-anchor="middle">(structure)</text>

</svg>
