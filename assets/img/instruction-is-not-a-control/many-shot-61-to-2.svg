<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="560" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1a1a1a">Many-shot jailbreak: instruction vs structure</text>
  <text x="24" y="54" font-size="13" fill="#666">Attack success rate. Fine-tuning only delayed it; a classifier ended it.</text>
  <!-- baseline y=280, top y=80 for 0..70% -> 2.857 px/% -->
  <line x1="90" y1="280" x2="520" y2="280" stroke="#ccc" stroke-width="1"/>
  <line x1="90" y1="80" x2="90" y2="280" stroke="#ccc" stroke-width="1"/>
  <text x="80" y="284" font-size="11" fill="#999" text-anchor="end">0</text>
  <text x="80" y="120" font-size="11" fill="#999" text-anchor="end">70%</text>
  <!-- bar 1: 61% -> height 174 -> y=106 -->
  <rect x="150" y="106" width="130" height="174" fill="#e03131"/>
  <text x="215" y="98" font-size="20" font-weight="700" fill="#e03131" text-anchor="middle">61%</text>
  <text x="215" y="302" font-size="12.5" fill="#333" text-anchor="middle">Refusal training</text>
  <text x="215" y="319" font-size="12.5" fill="#777" text-anchor="middle">(instruction)</text>
  <!-- bar 2: 2% -> height 5.7 -> y=274 -->
  <rect x="350" y="274" width="130" height="6" fill="#2f9e44"/>
  <text x="415" y="266" font-size="20" font-weight="700" fill="#2f9e44" text-anchor="middle">2%</text>
  <text x="415" y="302" font-size="12.5" fill="#333" text-anchor="middle">Input classifier</text>
  <text x="415" y="319" font-size="12.5" fill="#777" text-anchor="middle">(structure)</text>
  <text x="520" y="24" font-size="11" fill="#bbb" text-anchor="end">Anthropic, many-shot jailbreaking</text>
</svg>
