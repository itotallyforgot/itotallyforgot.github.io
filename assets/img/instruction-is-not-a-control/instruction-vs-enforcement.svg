<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9A9A9A"/>
    </marker>
  </defs>

  <!-- top band: instruction layer (negotiable) -->
  <rect x="16" y="24" width="728" height="168" rx="10" fill="#242424" stroke="#3A3A3A"/>
  <text x="32" y="48" font-size="13" font-weight="650" fill="#9A9A9A" letter-spacing="0.3">INSTRUCTION LAYER · negotiable</text>

  <rect x="56" y="86" width="232" height="62" rx="8" fill="#1A1A1A" stroke="#6E6E6E" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="172" y="113" font-size="13" fill="#C9C2B8" text-anchor="middle">Instruction</text>
  <text x="172" y="132" font-size="12" fill="#8A8A8A" text-anchor="middle">"refuse / run the tests"</text>

  <rect x="470" y="84" width="190" height="66" rx="8" fill="#1A1A1A" stroke="#6E6E6E" stroke-width="1.4"/>
  <text x="565" y="116" font-size="15" font-weight="650" fill="#E8E0D5" text-anchor="middle">AGENT / MODEL</text>

  <!-- "reasons around it" loop, stays above the divider, muted -->
  <path d="M470,112 C390,70 300,70 250,90" fill="none" stroke="#9A9A9A" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="66" font-size="12.5" font-style="italic" fill="#9A9A9A" text-anchor="middle">reasons around it</text>

  <!-- boundary, in signal -->
  <line x1="16" y1="214" x2="744" y2="214" stroke="#F76E25" stroke-width="3"/>
  <text x="380" y="232" font-size="12" font-weight="650" fill="#F76E25" text-anchor="middle" letter-spacing="0.3">agent-visibility boundary  ·  the agent cannot see or argue below this line</text>

  <!-- bottom band: enforcement layer (structural) -->
  <rect x="16" y="246" width="728" height="168" rx="10" fill="#2A211B" stroke="#5A3F2C"/>
  <text x="32" y="270" font-size="13" font-weight="650" fill="#F76E25" letter-spacing="0.3">ENFORCEMENT LAYER · structural, non-negotiable</text>

  <g font-size="13" fill="#E8E0D5" text-anchor="middle">
    <rect x="32" y="300" width="162" height="86" rx="8" fill="#1A1A1A" stroke="#F76E25" stroke-width="1.5"/>
    <text x="113" y="338">Network</text><text x="113" y="356">boundary</text>
    <rect x="206" y="300" width="162" height="86" rx="8" fill="#1A1A1A" stroke="#F76E25" stroke-width="1.5"/>
    <text x="287" y="347">Hash gate</text>
    <rect x="380" y="300" width="162" height="86" rx="8" fill="#1A1A1A" stroke="#F76E25" stroke-width="1.5"/>
    <text x="461" y="347">Sandbox</text>
    <rect x="554" y="300" width="162" height="86" rx="8" fill="#1A1A1A" stroke="#F76E25" stroke-width="1.5"/>
    <text x="635" y="338">Signed</text><text x="635" y="356">assertion</text>
  </g>
</svg>
