<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=20260507-cerberus">
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    {% unless page.hide_header %}
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">George Perez</a>
        <nav aria-label="Main navigation">
          <a href="{{ '/essays/secure-by-design-needs-a-receipt/' | relative_url }}">Secure by Design</a>
          <a href="{{ '/essays/honest-ai/' | relative_url }}">Honest AI</a>
          <a href="https://github.com/itotallyforgot">GitHub</a>
          <a href="https://www.linkedin.com/in/georgeperezthesecond">LinkedIn</a>
        </nav>
      </header>
    {% endunless %}

    <main class="{{ page.main_class | default: 'page' }}">
      {{ content }}
    </main>
  </body>
</html>
